[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floating-agent-daemon"
version = "0.1.0"
description = "Floating Multi-OS AI Assistant — native PySide6 overlay + Python agent core"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.27",
    "psutil>=6.0",
    "keyring>=25.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["floating_agent*"]

[tool.ruff]
line-length = 120
# Pinned to py313: `ruff format` on py314 strips except-clause parens (known bug). See DECISIONS D-0002.
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "S",
    "B",
    "A",
    "C4",
    "PT",
    "SIM",
    "TCH",
]
ignore = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=floating_agent --cov-report=xml --cov-report=term-missing --cov-fail-under=85"
