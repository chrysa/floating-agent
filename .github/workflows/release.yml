---
name: Release

on:
    push:
        branches: [main, master]
        paths-ignore:
            - '**.md'
            - .github/**
    workflow_dispatch:

jobs:
    # Lint gate: replays the full pre-commit suite (ruff + mypy) once per
    # release. Lint no longer runs on every PR/push (see ci.yml).
    lint:
        name: Lint gate (pre-commit replay)
        uses: chrysa/github-actions/.github/workflows/lint-python.yml@main
        with:
            python-version: "3.14"
            extras: dev

    call:
        needs: lint
        uses: chrysa/github-actions/.github/workflows/release.yml@main
        secrets:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
