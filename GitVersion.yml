assembly:
  fileVersioningScheme: MajorMinorPatch
branches:
  develop:
    increment: Minor
    mode: ContinuousDeployment
    regex: ^develop$
    tag: alpha
  feat:
    increment: Inherit
    mode: ContinuousDelivery
    regex: ^feat[/-]
    tag: useBranchName
  feature:
    increment: Inherit
    mode: ContinuousDelivery
    regex: ^features?[/-]
    tag: useBranchName
  fix:
    increment: Patch
    mode: ContinuousDelivery
    regex: ^fix(es)?[/-]
    tag: useBranchName
  main:
    increment: Patch
    is-mainline: true
    mode: ContinuousDelivery
    prevent-increment-of-merged-branch-version: true
    regex: ^main$
    tag: ''
    track-merge-target: false
  release:
    increment: None
    mode: ContinuousDelivery
    regex: ^releases?[/-]
    tag: rc
ignore:
  commits-before: ''
  sha: []
mode: ContinuousDelivery
